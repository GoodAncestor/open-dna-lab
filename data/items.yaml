gaps:
  - id: pipette-small
    name: Small-volume pipettes — P2 or P10, and P20
    priority: critical
    rationale: >
      Owned range starts at 10 uL. LSK114 and any fluorometric assay require
      1 uL handling, which the 10-100 uL unit cannot do. Accuracy at the
      bottom of a pipette's range is also its worst, so the 12 uL flow cell
      load currently sits in the least reliable part of the only pipette
      that can reach it.
    spec: P2 (0.1-2 uL), P10 (0.5-10 uL), P20 (2-20 uL)
    source_advice: >
      Buy refurbished-and-calibrated from Gilson, Rainin, or Eppendorf, or
      buy cheap and send for calibration before first use. A P20 delivering
      18 uL when set to 20 fails silently; the symptom is a flow cell that
      underperforms with no attributable cause.
    price: 400
    confidence: estimated

