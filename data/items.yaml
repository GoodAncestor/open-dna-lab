bench:
  - id: sous-vide
    name: Sous vide immersion circulator
    spec: holds 56 C and 65 C in a water bath
    notes: >
      Match incubation equipment to the selected extraction and library
      instructions. Confirm actual sample temperatures with a probe before
      substituting a water bath for specified equipment. Record the method and
