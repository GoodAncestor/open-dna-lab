library_prep:
  - id: ampure-xp
    name: AMPure XP beads (AXP)
    vendor: Beckman Coulter
    part: A63880
    price: 552
    confidence: verified
    pack: 5 mL
    shelf_life: 18 months
    storage: 2-8 C. Do not freeze — freezing destroys the beads permanently.
    # SUPPLIED INSIDE THE KIT. ONT's SQK-LSK114 protocol lists kit contents as
    # "Ligation Adapter (LA), Ligation Buffer (LNB), Long Fragment Buffer (LFB),
    # S Fragment Buffer (SFB), AMPure XP Beads (AXP), Elution Buffer (EB)" and
    # supplies AXP at the volume needed for both cleanups. Removed from the buy
    # list 2026-09-07 (Colby); price kept for the reorder case only.
    included_in: minion-mk1d-pack
    source: https://nanoporetech.com/document/genomic-dna-by-ligation-sqk-lsk114
    notes: >
      Supplied with SQK-LSK114 — do not buy separately for the bundled
      reactions. LSK114 runs two bead cleanups: 60 uL of AXP at end-prep and
      40 uL after adapter ligation, so 100 uL per prep, 600 uL across the six
      bundled reactions. Beckman's smallest bottle is 5 mL (A63880; the other
      sizes are 60 mL A63881 and 450 mL A63882), roughly eight times the whole
      need, on an 18-month clock at 2-8 C. Buy only if the kit AXP is missing,
      short, or past expiry. If that happens, price a cheaper equivalent
      (Omega Mag-Bind TotalPure NGS, KAPA Pure Beads) against the 5 mL bottle —
      equivalence for LSK114 is UNVERIFIED and would need a measured recovery
      comparison before it is trusted.

