    name: Open Colorimeter Plus
    vendor: IO Rodeo
    variant: 0.2 mL tube
    price: 200
    confidence: verified
    source: https://iorodeo.com/products/open-colorimeter-plus
    function: fluorometer
    notes: >
      TSL2591 sensor at 90 deg to the excitation LED, second TSL2591 at 180 deg
      for excitation normalisation. Removable cover accepts emission filters.
      Minimum fill 50 uL. Gain and integration time are user-settable on both
      sensors. Firmware is CircuitPython, open source.
      Assembled and available for testing, confirmed by the owner 2026-09-06.
      DNA quantification remains unvalidated against a reference instrument.
      Vendor fluorescence experiments describe filters and mounting geometry.
      Match those details to the assembled hardware revision before calibration.

