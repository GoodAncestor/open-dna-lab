# ---------------------------------------------------------------------------
# GAPS FOUND IN THE EXISTING BENCH — 2026-07-29 audit
# ---------------------------------------------------------------------------

gaps:
  - id: pipette-small
    name: P20 pipette, 2-20 uL
    priority: high
    # Revised 2026-09-07. Colby confirmed an ONiLAB 1-10 uL is also owned, so
    # the 1 uL handling this entry was written around is covered. Owned set is
    # now 1-10, 10-100, 100-1000. ONT's LSK114 third-party equipment list asks
    # for P2, P10, P20, P100, P200 and P1000.
    rationale: >
      The 10-20 uL band is the one nothing covers well. The 1-10 unit cannot
      reach 12 uL at all, and the 10-100 unit hits it at the very bottom of
      its range, where accuracy is worst. That is exactly where the flow cell
      load and several LSK114 transfers sit.
    spec: P20 (2-20 uL)
    source_advice: >
      Buy refurbished-and-calibrated from Gilson, Rainin, or Eppendorf, or
      buy cheap and send for calibration before first use. A P20 delivering
      18 uL when set to 20 fails silently; the symptom is a flow cell that
      underperforms with no attributable cause. The three owned ONiLAB units
      are all uncalibrated — the pocket scale gives a free gravimetric check
      at 100 uL and above, but cannot verify sub-10 uL delivery.
    price: 150
    confidence: estimated

  - id: bsa
    name: Bovine serum albumin, 50 mg/ml
    vendor: Invitrogen
    part: AM2616
    priority: high
    price: 60
    confidence: estimated
    storage: Follow the supplier label. Aliquot; avoid repeated freeze-thaw.
    source: https://nanoporetech.com/document/genomic-dna-by-ligation-sqk-lsk114
    rationale: >
      Named in the LSK114 third-party consumables list and missing from this
      register until 2026-09-07. Goes into the flow cell PRIMING mix, not the
      library: 5 uL of the 50 mg/ml stock into 1,170 uL Flow Cell Flush plus
      30 uL Flow Cell Tether, for a final 0.2 mg/ml. ONT frames it as
      recommended rather than mandatory, "for optimal sequencing performance
      and improved output" — it passivates the flow cell surface so library
      is not lost to it. Cheap insurance on a $988 consumable, so treat it as
      required here. ONT names Invitrogen UltraPure AM2616 specifically.
      Not interchangeable with nuclease-free water, which is already owned and
      is the diluent, not the additive.

  - id: scale-pocket
    name: Digital pocket scale, 0.01 g
    asin: B07ZQZ962K
    link: https://www.amazon.com/gp/product/B07ZQZ962K
    priority: medium
    price: 18.99
    confidence: verified
    source: https://www.amazon.com/gp/product/B07ZQZ962K
    rationale: >
      Gravimetric pipette check is free once a scale exists — 1 uL of water
      weighs 1 mg. Also needed for making buffers and standards. Replaces the
      analytical balance that was on this list: 0.01 g resolution will not
      verify sub-10 uL pipettes, but it covers buffer and standard prep for
      a fraction of the cost.


