sequencing:
  - id: minion-mk1d-pack
    name: MinION Mk1D Pack
    vendor: Oxford Nanopore
    price: 5150
    confidence: verified
    source: https://nanoporetech.com/products/sequence/minion
    notes: >
      Includes sequencing consumables and five flow cells. Device alone is around $3,200. USB-C only to a host computer;
      USB-A adapters unsupported. Requires MinKNOW 24.11.10 or later. Network
      access required at all times for telemetry, which is also what enables
      flow cell warranty replacement. Licence states the device is not intended
      for providing sequencing services to third parties.

    # Everything that goes on or into the MinION. Flow cells are the consumable
    # that governs running cost, and the wash kit is what makes them reusable.
    consumables:
      - id: flowcell-r1041
        name: MinION flow cell R10.4.1
        vendor: Oxford Nanopore
        part: FLO-MIN114
        price: 988
        unit: each
        confidence: verified
        source: https://stockroom.tamu.edu/products/Flow-Cell-R10-4-1-FLO-MIN114-76595-418-p651044536
        quantity: 5
        consumable: true
        reusable_with: wash-kit
        # Already paid for inside the pack price. Listed for the running cost it
        # implies, but excluded from totals so the pack is not counted twice.
        included_in: minion-mk1d-pack
        warranty: >
          12 weeks from delivery date, minimum 800 pores. Verified 2026-09-07
          from ONT's warranty and storage page. The warranty applies ONLY to a
          flow cell check performed BEFORE the first sequencing run — it does
          not apply to checks after sequencing and washing. Report failures
          within 2 business days of the check. Practical consequence: check
          every cell on arrival, before anything else, or a dud $988 cell is
          unrecoverable.
        storage: >
          2-8 C from receipt (35.6-46.4 F). ONT: flow cells "do not tolerate
          freezing temperatures even for short period of time." A domestic
          fridge is in range, but the rear wall and the air off the cold vent
          drop below freezing — front of a middle shelf, never the door, never
          near the freezer compartment, probe-verified over 24 h first.
        notes: >
          Five included in the recorded Mk1D pack. Verify stock, storage history,
          and the flow-cell check before use. Follow current ONT instructions
          for storage, loading, washing, and replacement conditions. Measure
          yield and callable coverage. Flow-cell count does not guarantee 30x
          whole-genome coverage. The first validation uses adaptive sampling off.

      - id: wash-kit
        name: Flow Cell Wash Kit
        vendor: Oxford Nanopore
        part: EXP-WSH004
        price: 111
        confidence: verified
        source: https://stockroom.tamu.edu/products/Flow-Cell-Wash-Kit-Oxford-Nanopore-Technologies-6-reactions-76487-116-p577969515
        kit_item: true
        storage: Per the supplier label. Not a flow cell — does not share the 2-8 C rule.
        notes: >
          Supplied with the recorded Mk1D pack (confirmed by Colby 2026-09-07);
          price is the reorder cost.
          Six washes. This is what turns the flow cell from single-use into
          reusable — reload a half-spent cell for roughly $17 per wash.

      - id: lsk114
        name: Ligation Sequencing Kit V14
        vendor: Oxford Nanopore
        part: SQK-LSK114
        price: 610
        confidence: estimated
        pack: 6 reactions
        # Comes with the Mk1D pack, and is also offered as an option on it.
        # Price kept here for the reorder cost once the bundle is used up.
        included_in: minion-mk1d-pack
        storage: >
          -20 C for long-term storage. ONT states its sequencing kits keep
          1-2 weeks at ambient (25 C) and up to 4 weeks at 4 C. Kits carry a
          printed lot expiry — record it on arrival.
        supplies: >
          Contains AMPure XP Beads (AXP) at the volume both cleanups need, plus
