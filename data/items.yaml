sequencing:
  - id: minion-mk1d-pack
    name: MinION Mk1D Pack
    vendor: Oxford Nanopore
    price: 5150
    confidence: verified
    source: https://nanoporetech.com/products/sequence/minion
    notes: >
      Includes sequencing consumables and five flow cells. Device alone is around $3,200. USB-C only to a host computer;
      USB-A adapters unsupported. Requires MinKNOW 24.11.10 or later. Network
      access required at all times for telemetry, which is also what enables
      flow cell warranty replacement. Licence states the device is not intended
      for providing sequencing services to third parties.

    # Everything that goes on or into the MinION. Flow cells are the consumable
    # that governs running cost, and the wash kit is what makes them reusable.
    consumables:
      - id: flowcell-r1041
        name: MinION flow cell R10.4.1
        vendor: Oxford Nanopore
        part: FLO-MIN114
        price: 988
        unit: each
        confidence: verified
        source: https://stockroom.tamu.edu/products/Flow-Cell-R10-4-1-FLO-MIN114-76595-418-p651044536
        quantity: 5
        consumable: true
        reusable_with: wash-kit
        # Already paid for inside the pack price. Listed for the running cost it
        # implies, but excluded from totals so the pack is not counted twice.
        included_in: minion-mk1d-pack
        notes: >
          Five included in the Mk1D pack. A consumable, but not single-use —
          the Flow Cell Wash Kit reloads a half-spent cell for roughly $17 a
          wash, so cost per run depends on how hard each cell is worked rather
          than on the $988 sticker. Yield 20-40 Gb over 48 h on a fresh cell.
          Human genome at 30x needs roughly 3-4 cells merged, or one cell with
          adaptive sampling for 30-50x on a panel under 1% of the genome.
          Store at 4 C. Pore-check before loading: warm 20 min, expect about
          1,200 pores, require at least 800, claim warranty before loading if
          below.

      - id: wash-kit
        name: Flow Cell Wash Kit
        vendor: Oxford Nanopore
        part: EXP-WSH004
        price: 111
        confidence: verified
        source: https://stockroom.tamu.edu/products/Flow-Cell-Wash-Kit-Oxford-Nanopore-Technologies-6-reactions-76487-116-p577969515
        kit_item: true
        notes: >
          Six washes. This is what turns the flow cell from single-use into
          reusable — reload a half-spent cell for roughly $17 per wash.

      - id: lsk114
        name: Ligation Sequencing Kit V14
        vendor: Oxford Nanopore
        part: SQK-LSK114
        price: 610
        confidence: estimated
        pack: 6 reactions
        # Comes with the Mk1D pack, and is also offered as an option on it.
        # Price kept here for the reorder cost once the bundle is used up.
        included_in: minion-mk1d-pack
        notes: >
          Supplied with the Mk1D pack. Preserves base modifications. No
          PCR-based kit can be used for epigenome work — amplification erases
          methylation. The figure is the reorder price once the bundled
          reactions are used up.

      - id: flongle-adapter
        name: Flongle adapter
        vendor: Oxford Nanopore
        part: FLGIntSP
        price: 500
        confidence: estimated
        kit_item: true
        rationale: >
          Unlocks $90 pilot runs. A Flongle reports read N50 directly, which is
          a better fragment-length assay than a gel and answers extraction
          quality, library prep, and read length in one $90 experiment.

      - id: flongle-flowcells
        name: Flongle flow cells
        vendor: Oxford Nanopore
        part: FLO-FLG114
        price: 90
        unit: each
        quantity: 6
        confidence: verified
        source: https://oxfordnanoporedx.com/products
        consumable: true
        kit_item: true

      - id: nebnext-v2
        name: NEBNext Companion Module v2 for ONT Ligation Sequencing
        vendor: New England Biolabs
        part: E7672S
        price: 1275
        confidence: estimated
        pack: 24 reactions
        kit_item: true
        notes: >
          ONT recommends v2 over the older E7180S — better dA-tailing and
          ligation from FFPEv2 Repair Buffer and Salt-T4 Ligase, lower cost per
          prep. Pack size is 24 reactions against a need of one or two.
          Splitting or sourcing a partial pack is worth pursuing.

