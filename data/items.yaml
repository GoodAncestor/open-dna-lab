# Emitters — LED boards, catalogued by wavelength. What each one is FOR is the
# useful column; the price is trivia.
#
# Electrically every board fits every instrument — 4-pin JST SH / STEMMA QT. Two
# things actually constrain a pairing:
#   sensor range   TSL2591 (Open Colorimeter, Plus) broad visible-IR
#                  AS7341  (Multichannel) 415-680 nm, 10 channels
#                  AS7331  (UV Open Colorimeter) 230-430 nm
#   mounting       radial boards need the radial cuvette holder; surface boards
#                  use the standard one
#
# The radial/surface pairs at 400/405, 470 and 625/630 were bought deliberately:
# surface fires axially for straight-line absorbance, radial fires sideways for
# the 90 degree fluorescence path in the Plus.
#
# Three of the twelve are in the sequencing path — 255 and 278 for purity, 470
# radial for fluorometry. The rest serve colorimetry and electrochemistry.
emitters:
  vendor: IO Rodeo
  source: https://iorodeo.com/pages/led-boards
  confidence: verified
  items:
    - id: led-278
      name: 278 nm emitter
      wavelength_nm: 278
      price: 26
      format: surface
      goes_in: UV Open Colorimeter
      for: >
        Protein absorbance. Tryptophan and tyrosine peak near 280. Paired with
        the built-in 255 nm channel this gives the approximate 260/280 purity
        proxy. Neither reaches 230, which is why A260/230 stays unmeasurable
        on this bench.

    - id: led-365
      name: 365 nm emitter
      wavelength_nm: 365
      price: 21
      format: radial
      goes_in: UV Open Colorimeter, or the Plus
      for: >
        Fluorescence excitation for AccuBlue Broad Range (350/460), Hoechst
        33258, DAPI, quinine. Also drives plastic autofluorescence, which
        argues against it for tube-based assays.

    - id: led-400
      name: 400 nm emitter
      wavelength_nm: 400
      price: 14
      format: radial
      goes_in: UV Open Colorimeter, or the Plus
      for: Violet-excited dyes.

    - id: led-405
      name: 405 nm emitter
      wavelength_nm: 405
      price: 15
      format: surface
      goes_in: UV Open Colorimeter, or the standard Open Colorimeter
      for: >
        The p-nitrophenol wavelength — readout for alkaline phosphatase and
        beta-galactosidase. This is the ELISA channel.

    - id: led-470r
      name: 470 nm emitter
      wavelength_nm: 470
      price: 14
      format: radial
      goes_in: Open Colorimeter Plus — the fluorometer
      for: >
        The DNA fluorometry channel. AccuClear (468 nm), PicoGreen, SYBR, FITC,
        GFP. This is the board the emission filter is being chosen for, and the
        radial format is the one to use: IO Rodeo measured about a 16-fold
        signal gain from a radial LED and a shortened mount, 4,056 against 252
        RFU on their own DNA assay.

    - id: led-470
      name: 470 nm emitter
      wavelength_nm: 470
      price: 7
      format: surface
      goes_in: standard Open Colorimeter, or Multichannel
      for: Blue absorbance, rather than the fluorescence path.

    - id: led-520
      name: 520 nm emitter
      wavelength_nm: 520
      price: 7
      format: surface
      goes_in: standard Open Colorimeter, or Multichannel
      for: Pink and magenta solutions. Nitrite by Griess sits near 540 nm.

    - id: led-625
      name: 625 nm emitter
      wavelength_nm: 625
      price: 14
      format: radial
      goes_in: standard Open Colorimeter
      for: Turbidity and cell density — the practical stand-in for OD600.

    - id: led-630
      name: 630 nm emitter
      wavelength_nm: 630
      price: 7
      format: surface
      goes_in: standard Open Colorimeter, or Multichannel
      for: OD600 stand-in. 630 nm is a standard plate-reader wavelength.

    - id: led-660
      name: 660 nm emitter
      wavelength_nm: 660
      price: 7
      format: surface
      goes_in: standard Open Colorimeter, or Multichannel
      for: Chlorophyll a peaks at 662 nm. Also methylene blue and modified Lowry.

    - id: led-850
      name: 850 nm emitter
      wavelength_nm: 850
      price: 7
      format: surface
      goes_in: standard Open Colorimeter (TSL2591)
      for: >
        Near-IR. Few chromophores absorb here so scattering dominates, which
        measures cell density in pigmented cultures where visible turbidity
        readings are confounded.

