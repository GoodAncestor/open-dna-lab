bench:
  - id: sous-vide
    name: Sous vide immersion circulator
    spec: holds 56 C and 65 C in a water bath
    notes: >
      ONT's consumables list specifies a thermal cycler at 20 C and 65 C. A
      published home run used a heat block at 56 C and 65 C, with the 20 C
      end-prep step at room temperature. Both temperatures are in active use:
      65 C for LSK114 end-prep and FFPE repair, 56 C for Nanobind lysis.
      A used thermal cycler at $200-500 covers the same ground and adds PCR.

  - id: vortex
    name: Vortex mixer
    price: 100
    confidence: estimated
    priority: high
    notes: For reagents. Never for HMW DNA or enzyme mixes.

  - id: pcr-tubes
    name: 0.2 mL thin-walled tubes
    price: 40
    confidence: estimated
    priority: high
    notes: >
      Not for PCR — no step here amplifies. These are the cuvettes for the Open
      Colorimeter Plus, which is built around the 0.2 mL tube format. Without
      them the fluorometer has nothing to read a sample in.

