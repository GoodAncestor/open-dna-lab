# Good Ancestor open lab — item register
#
# Single source of truth. The site, the buy list, and the inventory table all
# generate from this file. Do not duplicate item data in markdown.
#
# There is no status field. An item is either on the buy list or it is owned:
#
#   priority:      critical | high | medium | low  — presence puts it on the buy
#                  list. Absence means it is already on the bench.
#   contingent_on: an item id. A fallback, bought only if the named item
#                  fails. Kept off the buy list and off the total.
#   confidence:    verified (checked against a vendor page, date recorded)
#                  estimated (my figure, unconfirmed)
#   revisit:       ruled_out only. Rejected for now, worth reconsidering later.
#
# All prices USD.

meta:
  updated: 2026-07-29
  currency: USD
  note: >
    Prices marked estimated have not been checked against a vendor.
    Confirm before ordering. Used-equipment prices move fast.

