# ---------------------------------------------------------------------------
# QC
# ---------------------------------------------------------------------------

qc:
  - id: qubit3
    name: Qubit 3 Fluorometer, used
    vendor: Thermo Fisher
    price: 1400
    confidence: verified
    source: eBay listing observed 2026-07
    # Fallback only, bought if the Open Colorimeter Plus we already own
    # cannot do fluorometric quant well enough for library QC.
    contingent_on: open-colorimeter-plus
    contingency: >
      Purchase remains a fallback. Seek reference fluorometry through a loan,
      shared lab, or measurement service. If access is unavailable, record the
      pilot limitations. Compare extraction and library concentrations before
      deciding whether a purchase is needed.
    rationale: >
      Functionally identical to the Qubit 4 for dsDNA HS and BR. The 4 adds
      RNA IQ, which this workflow does not need. Assays are shared between the
      3 and 4, so consumable supply is safe despite the 3 being discontinued.
      A published home-sequencing account records skipping fluorometric quant
      and getting poor pore occupancy with no way to tell whether extraction
      or library prep had failed.
    alternatives:
      - {name: Qubit 4 used, price: 2850, verdict: "skip — premium buys RNA IQ only"}
      - {name: DeNovix QFX used, price: 3000, verdict: "networked data export, cheaper assays, $1,600 premium"}

  - id: accuclear
    name: AccuClear Ultra High Sensitivity dsDNA Quantitation Kit
    vendor: Biotium
    variant: trial size, 200 assays
    confidence: estimated
    priority: high
    notes: >
      Ex/Em 468/507 nm, linear 0.03-250 ng, store 2-8 C, 20X buffer concentrate.
      468 nm excitation matches the owned 470 nm LED board.
      The 7-standard set ships only in the 1,000-assay kit; trial size includes
      one 25 ng/uL standard. Make your own dilution series.
      Range covers both Nanobind eluates and dilute post-AMPure libraries.
    alternatives:
      - name: AccuBlue Broad Range
        spec: 350/460 nm, 2-2000 ng
        verdict: >
          110 nm Stokes shift makes filtering far easier and pairs with the
          365 nm radial board. Rejected on two counts — polypropylene tubes
          autofluoresce under 365 nm, and a 2 ng floor is too high for
          library QC.
      - name: AccuGreen High Sensitivity
        spec: 502/523 nm, 0.1-100 ng
        verdict: Buy this instead if a Qubit is acquired. Designed for Qubit optics.

  - id: emission-filter
    name: Emission filter for Open Colorimeter Plus
    spec: about 500 nm longpass, paired with the radial 470 nm board
    price: 30
    confidence: estimated
    priority: high
    notes: >
      Longpass, not bandpass. IO Rodeo ran this assay and reported comparable
      results from both, with longpass giving higher RFU and bandpass slightly
      lower background. Longpass is the cheaper part, so it wins on their own
      numbers. Use the radial 470 nm board with it — their measured gain from
      radial excitation and a shortened mount was about 16-fold.
    lead: >
      blog.iorodeo.com/open-colorimeter-plus-led-boards/ — the vendor's own DNA
      assay results. Also github.com/traulab/diynafluor, an open-source DNA
      fluorometer from AliExpress parts for about $80.
    options:
      - {source: "eBay, MidOpt used, seller discount-optics", price: 30, confidence: verified}
      - {source: "Thorlabs FEL0500 longpass", price: 90, confidence: estimated}
      - {source: "Edmund #29363, 525 nm CWL 25 mm OD4 50 nm BP", price: 275, confidence: verified, note: "bandpass — the earlier plan, superseded"}
    technique: >
      Two stacked OD3 filters give OD6. Cheaper than one mid-tier filter and
      often sufficient in 90 deg geometry, where the background is scatter
      rather than the direct beam.
    open_question: >
      IO Rodeo documents a 6 x 6 mm filter holder in its fluorescence article.
      Confirm the assembled holder revision, fitted filter, optical background,
      and assay performance against reference fluorometry. The current UV bench
      has no validated A260/A230 measurement. A new emitter would also require
      compatible optics and reference comparison.

  - id: excitation-filter
    name: Excitation filter, 470/40 bandpass
    price: 30
    confidence: estimated
    contingent_on: emission-filter
    contingency: >
      Add only if fluorescence background is high once the emission filter is
      in. Blue LEDs have a long red tail that leaks through the emission
      filter, and cleaning up the excitation often buys more than upgrading the
      emission filter.

# ---------------------------------------------------------------------------
# COLORIMETRY — reagents for the caffeine and vitamin C bench-qualification
# assays. See site/colorimetry-protocol.md. None of this touches the DNA path;
# it exists so the colorimeters get characterised against a known answer before
# a $988 flow cell depends on one of their readings.
# ---------------------------------------------------------------------------

colorimetry:
  - id: caffeine-anhydrous
    name: Caffeine anhydrous USP powder
    price: 20
    confidence: estimated
    priority: medium
    notes: >
      The calibration standard for the 278 nm caffeine assay. Weigh it on a
      balance, never by volume: a level teaspoon holds several grams, which is
      in the range that has killed people. Label the stock solution.
      Compounding-ingredient suppliers sell it. At 1 g per litre of stock,
      100 g lasts for years.

  - id: caffeine-tablets
    name: Caffeine tablets, 200 mg
    price: 8
    confidence: estimated
    priority: medium
    notes: >
      The reference sample for the recovery check. The excipients are cellulose
      and magnesium stearate. Neither absorbs in the UV. The label claim is a
      specification with its own tolerance, not a certified value, so the check
      is good to a few percent.

  - id: ascorbic-acid
    name: L-ascorbic acid USP powder
    price: 18
    confidence: estimated
    priority: medium
    notes: >
      The vitamin C standard. It degrades in solution within a day even when
      acidified, so make the stock fresh each session. The powder keeps if you
      store it dry and dark.

  - id: dcpip
    name: 2,6-dichlorophenolindophenol sodium salt
    price: 45
    confidence: estimated
    priority: medium
    notes: >
      The redox dye for the vitamin C assay. Blue above about pH 6, with a peak
      near 600 nm. Pink below pH 6, with a peak near 520 nm. Colourless once
      reduced. VWR, Thermo, Sigma and Lab Alley all list it, and 1 g is far
      more than this bench will use. The solution weakens daily. Store it in an
      amber bottle at 4 C.

  - id: stabilising-acid
    name: Metaphosphoric acid, or oxalic acid
    price: 25
    confidence: estimated
    priority: medium
    notes: >
      Holds vitamin C against oxidation during extraction and reading.
      Metaphosphoric acid at 3% is the AOAC choice and also precipitates
      protein. Oxalic acid at 0.4% is cheaper and works for juices and tablets.
      Metaphosphoric acid degrades in solution, so make it fresh. Do not
      swallow oxalic acid: it is toxic.

  - id: syringe-filters
    name: Syringe filters, 0.45 um, 25 mm, 100 pk
    price: 22
    confidence: estimated
    priority: medium
    notes: >
      Undissolved excipient and coffee grounds scatter light, and the
      instrument reads scatter as absorbance. Filter every real sample before
      it goes in a cuvette.

  - id: volumetric-flasks
    name: Volumetric flasks, 100 mL and 1 L, Class A
    price: 45
    confidence: estimated
    priority: medium
    notes: >
      Every concentration on the colorimetry page traces back to one weighing
      and one flask. A graduated cylinder is not accurate enough to carry a
      calibration curve.

  - id: ascorbate-oxidase
    name: Ascorbate oxidase
    optional: true
    notes: >
      Destroys vitamin C in one half of a split sample, so the difference
      between the halves is vitamin C rather than total reducing capacity. This
      is the specific way to do it. The protocol starts with the cheap
      substitutes, copper and air or brief alkali, and this enzyme is what
      would calibrate them.

